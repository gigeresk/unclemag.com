<!DOCTYPE html>
<html>
   <head>
      <meta
         charset="utf-8">
      <meta
         name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
      <meta property="og:title" content="Uncle Magazine">
      <meta property="og:description" content="By Uncles, For Uncles">
      <meta property="og:image" content="img/site-image.jpg">
      <meta name="twitter:card" content="summary_large_image">
      <title>Uncle Magazine</title>
      <link rel="icon" type="image/x-icon" href="images/favicon-groucho.png">
      <style type="text/css">html{min-height:100%;padding:0 max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));
         background:#7f7765 url("images/magic-eye-bg.webp") center top/600px auto repeat}
         body{margin:0 auto;max-width:1040px;min-height:100vh;box-sizing:border-box;padding:40px 20px 30px;
         display:flex;flex-direction:column;justify-content:center;gap:40px;
         font:900 18px/1.4 "Arial Black","Helvetica Neue",Arial,sans-serif;color:#fff;text-align:center;
         text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,
         0 -2px 0 #000,0 2px 0 #000,-2px 0 0 #000,2px 0 0 #000,4px 4px 0 #000}
         a{color:#fff}
         /* Phones and tablets: a strip of background above and below the page, scrolled just past on
            load (see the script below). */
         html.bleed{padding-top:100px;padding-bottom:160px;background-position:center 100px}

         /* Masthead: the black logo turned white, with a black outline and a hard drop shadow. */
         header h1{margin:0;line-height:0}
         header img{width:min(520px,80vw);height:auto;transform:rotate(-3deg);
         filter:invert(1) drop-shadow(3px 0 0 #000) drop-shadow(-3px 0 0 #000) drop-shadow(0 3px 0 #000)
         drop-shadow(0 -3px 0 #000) drop-shadow(10px 10px 0 rgba(0,0,0,.75))}

         /* Covers, strewn a little crooked like magazines on a coffee table; they straighten up on hover. */
         .issues{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);
         gap:44px;align-items:end}
         .issues li{--tilt:-3deg}
         .issues li:nth-child(2){--tilt:2deg}
         .issues li:nth-child(3){--tilt:-1.5deg}
         .issues a{display:block;width:fit-content;max-width:100%;margin:0 auto;outline:none;
         transform:rotate(var(--tilt));transition:transform .2s}
         .issues img{display:block;width:100%;max-width:300px;height:auto;
         box-shadow:0 0 0 2px #000,12px 12px 0 rgba(0,0,0,.7)}
         /* Hover: lifts a little (as before) and a thin white-and-black outline appears around the frame. */
         .issues a:hover,.issues a:focus-visible{transform:rotate(var(--tilt)) translateY(-4%)}
         .issues a:hover img,.issues a:focus-visible img{
         box-shadow:0 0 0 2px #000,0 0 0 5px #fff,0 0 0 7px #000,12px 12px 0 rgba(0,0,0,.7)}

         nav{font-size:15px;position:relative}
         nav a{display:inline-block;margin:4px 10px}
         nav a:hover{color:#ffe44d}
         nav a[aria-expanded="true"]{color:#ffe44d}
         #about{position:absolute;top:100%;left:0;right:0;max-width:560px;margin:14px auto 0;font-size:16px;line-height:1.5;text-wrap:balance}

         @media (max-width:640px){
            body{gap:32px}
            .issues{grid-template-columns:1fr;gap:48px;max-width:260px;margin:0 auto}
         }
      </style>
      <script>
         // Phones and tablets: while a page is scrolled right to the top, Safari fills its top and
         // bottom bars with the flat background colour (grey) instead of the pattern. Once the page
         // is scrolled it shows the page behind them, so start a little way into a strip of extra
         // background (html.bleed) above the content.
         if (!matchMedia('(hover: hover) and (pointer: fine)').matches) {
            document.documentElement.classList.add('bleed');
            addEventListener('DOMContentLoaded', function () {
               if (!scrollY && !location.hash) scrollTo(0, 100);
            });
         }
      </script>
   </head>
   <body>
      <header>
         <h1><img src="images/uncle-logo-black.png" alt="Uncle Magazine"></h1>
      </header>
      <ul class="issues">
         <li>
            <a href="reader.html?issue=2025"><img src="images/Uncle_Magazine_2025cover.jpg" alt="Uncle Magazine, December 14th 2025 19:42 EST cover"></a>
         </li>
         <li>
            <a href="reader.html?issue=2024"><img src="images/Uncle_Magazine_2024cover.webp" alt="Uncle Magazine, Spring-Summer-Fall 2024 cover"></a>
         </li>
         <li>
            <a href="reader.html?issue=2023"><img src="images/20203_snap.png" alt="Uncle Magazine, Summer 20203 cover"></a>
         </li>
      </ul>
      <nav>
         <a href="mailto:editor@unclemag.com">editor@unclemag.com</a>
         <a href="https://web.archive.org/web/20250524203948/https://ssynse.com/">Store (archived)</a>
         <a href="about.html" id="about-toggle" aria-controls="about" aria-expanded="false">About</a>
         <p id="about" hidden>The Uncle Magazine is a print publication conceived by the Honourable F. Guy J. Tombs, esq., PhD, M.D., DPT.</p>
      </nav>
      <script>
         // About opens and closes in place under the links (about.html stays for anyone without JS).
         document.getElementById('about-toggle').addEventListener('click', function (e) {
            e.preventDefault();
            var about = document.getElementById('about'), open = about.hidden;
            about.hidden = !open;
            this.setAttribute('aria-expanded', open);
            if (open) about.scrollIntoView({block: 'nearest', behavior: 'smooth'});
         });
      </script>
   </body>
</html>
