      <style type="text/css">
         .tg  {border-collapse:collapse;border-spacing:1;width:100%;}
         .tg td{border-color:transparent;border-style:solid;border-width:1px;font-size:18px;
         padding:10px 5px;word-break:normal;text-align:center;vertical-align:top;width:33.33%;}
         .tg a{display:block;position:relative;width:fit-content;max-width:100%;margin:0 auto 8px;
         transition:transform .2s}
         .tg img{max-width:100%;height:auto;display:block}
         /* Hover: lifts a little, with a white line just inside the cover edge and a black one just outside it. */
         .tg a:hover,.tg a:focus-visible{transform:translateY(-4%);outline:none}
         .tg a:hover:after,.tg a:focus-visible:after{content:"";position:absolute;inset:0;
         border:1.5px solid #fff;outline:1px solid #000;pointer-events:none}
