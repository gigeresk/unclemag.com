<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="theme-color" content="#000">
      <title>Uncle Magazine</title>
      <link rel="icon" type="image/x-icon" href="images/favicon-groucho.png">
      <style type="text/css">
         html,body{height:100%;margin:0}
         html{background:#000 url("images/magic-eye-bg.webp") center/600px auto repeat fixed}
         body{display:flex;flex-direction:column;overflow:hidden;font-family:sans-serif;
         font-size:18px;color:#fff;font-weight:bold;
         text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,
         0 -2px 0 #000,0 2px 0 #000,-2px 0 0 #000,2px 0 0 #000,0 0 8px #000}
         a{color:#fff}
         .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;
         padding:10px 16px;flex:0 0 auto}
         #stage{flex:1 1 0;display:flex;align-items:center;justify-content:center;
         min-height:0;padding:0 16px 16px}
         #frame{margin:0 auto;visibility:hidden}
         .page{background:#fff}
         .page img{width:100%;height:100%;display:block;object-fit:contain}
         .page.filler{background:#000}
         .filler .bg{width:100%;height:100%;background:url("images/magic-eye-bg.webp") 0 0/600px auto repeat}
         #status{position:absolute;left:0;right:0;top:50%;text-align:center}
      </style>
   </head>
   <body>
      <div class="bar">
         <a href="./">&larr; Back</a>
         <a id="dl" href="#" download>PDF</a>
      </div>
      <div id="stage"><div id="frame"><div id="book"></div></div></div>
      <div id="status">Loading&hellip;</div>

      <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
      <script>
      (async function () {
         var status = document.getElementById('status');
         var stage = document.getElementById('stage');
         var frame = document.getElementById('frame');
         var book = document.getElementById('book');

         // reader.html?issue=2025 reads pages/2025/info.json and pages/2025/1.webp, 2.webp, ...
         // (made by tools/render_pages.py)
         var slug = new URLSearchParams(location.search).get('issue') || '';
         if (!/^[\w-]+$/.test(slug)) { status.textContent = 'Issue not found.'; return; }
         var dir = 'pages/' + slug + '/';

         var info;
         try {
            info = await (await fetch(dir + 'info.json')).json();
         } catch (e) {
            status.textContent = 'Issue not found.';
            return;
         }
         document.title = info.title;
         document.getElementById('dl').href = info.pdf;

         var n = info.pages, ratio = info.width / info.height, MINW = 200;

         // Book layout, by page-flip index: [filler, cover], [2, 3], ... , [last, filler?]
         // The library hides the page being turned by drawing the page underneath over it, so
         // "nothing" beside the front and back covers has to be a real page. These fillers are
         // painted with the site background, lined up with it so they look like empty space.
         // With a filler at index 0, page-flip index i is magazine page i.
         var fillerBgs = [];
         function addFiller() {
            var f = document.createElement('div');
            f.className = 'page filler';
            var bg = document.createElement('div');
            bg.className = 'bg';
            f.appendChild(bg);
            book.appendChild(f);
            fillerBgs.push(bg);
         }
         addFiller();
         var imgs = [];
         for (var i = 1; i <= n; i++) {
            var div = document.createElement('div');
            div.className = 'page';
            var img = document.createElement('img');
            img.alt = '';
            img.decoding = 'async';
            div.appendChild(img);
            book.appendChild(div);
            imgs.push(img);
         }
         if (n % 2 === 0) addFiller();

         // Fetch the cover alone first so it isn't competing for bandwidth, then the rest in order.
         imgs[0].src = dir + '1.webp';
         await imgs[0].decode().catch(function () {});
         imgs.slice(1).forEach(function (img, k) { img.src = dir + (k + 2) + '.webp'; });

         // Size the book so a spread (or single page on narrow screens) fits the viewport.
         function fit() {
            var aw = stage.clientWidth - 32, ah = stage.clientHeight - 16;
            var w = Math.min(aw, ah * ratio * 2);
            if (w < MINW * 2) w = Math.min(aw, ah * ratio);
            frame.style.width = Math.max(MINW, Math.floor(w)) + 'px';
         }
         window.addEventListener('resize', fit);
         fit();

         var flip = new St.PageFlip(book, {
            width: info.width, height: info.height,
            size: 'stretch',
            minWidth: MINW, maxWidth: 2000,
            minHeight: MINW / ratio, maxHeight: 2000 / ratio,
            startPage: 1,
            usePortrait: true,
            maxShadowOpacity: 0.5,
            mobileScrollSupport: false
         });
         flip.loadFromHTML(book.querySelectorAll('.page'));
         status.style.display = 'none';
         frame.style.visibility = 'visible';

         // Line the fillers' pattern up with the page background (600px tiles, centred, fixed).
         var TILE_W = 600, TILE_H = 600 * 670 / 1185;
         // Checked every frame (cheap) so it stays put through flips, resizes and re-layouts.
         (function alignFillers() {
            var ox = (document.documentElement.clientWidth - TILE_W) / 2;
            var oy = (window.innerHeight - TILE_H) / 2;
            fillerBgs.forEach(function (bg) {
               var r = bg.getBoundingClientRect();
               var pos = (ox - Math.round(r.left)) + 'px ' + (oy - Math.round(r.top)) + 'px';
               if (bg.style.backgroundPosition !== pos) bg.style.backgroundPosition = pos;
            });
            requestAnimationFrame(alignFillers);
         })();

         // One page at a time (phones): never stop on a filler.
         function skipFillers() {
            if (flip.getOrientation() !== 'portrait') return;
            var i = flip.getCurrentPageIndex();
            if (i < 1) flip.turnToPage(1);
            if (i > n) flip.turnToPage(n);
         }
         flip.on('flip', skipFillers);
         flip.on('changeOrientation', skipFillers);
         document.addEventListener('keydown', function (e) {
            var i = flip.getCurrentPageIndex();
            if (e.key === 'ArrowLeft' && i > 1) flip.flipPrev();
            if (e.key === 'ArrowRight' && i < n) flip.flipNext();
         });
      })();
      </script>
   </body>
</html>
