<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
      <title>Uncle Magazine</title>
      <link rel="icon" type="image/x-icon" href="images/favicon-groucho.png">
      <script>
         // Phones and tablets: a strip of background above and below the reader, which the page is
         // kept scrolled just into (see BLEED below). Tablets (touch, no mouse, a big screen) also
         // use the magnifying glass instead of pinch-zoom.
         if (!matchMedia('(hover: hover) and (pointer: fine)').matches) {
            document.documentElement.classList.add('bleed');
            if (Math.min(screen.width, screen.height) >= 600) document.documentElement.classList.add('tablet');
         }
      </script>
      <style type="text/css">
         html,body{height:100%;margin:0;overscroll-behavior:none}
         html{background:#7f7765 url("images/magic-eye-bg.webp") center top/600px auto repeat}
         body{display:flex;flex-direction:column;overflow:hidden;font-family:sans-serif;
         font-size:18px;color:#fff;font-weight:bold;
         text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,
         0 -2px 0 #000,0 2px 0 #000,-2px 0 0 #000,2px 0 0 #000,0 0 8px #000}
         a{color:#fff}
         /* It's a magazine, not a document: no selection highlight (Ctrl+A, drags) or image dragging. */
         html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
         ::selection{background:transparent}
         img{-webkit-user-drag:none}
         .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;
         padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));flex:0 0 auto}
         #stage{flex:1 1 0;display:flex;align-items:center;justify-content:center;
         min-height:0;padding:0 calc(64px + env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
         /* At normal size, the book takes one-finger drags (page turns) and the browser only pinches.
            Zoomed in, the browser takes everything so one finger moves you around the page. */
         #stage{touch-action:pinch-zoom}
         html.zoomed #stage{touch-action:auto}
         /* page-flip gives the book touch-action:pan-y, which (touch-action is combined down the
            tree) switches pinch-zoom off over the whole book. The id selector beats its class rule. */
         #book{touch-action:pinch-zoom}
         html.zoomed #book{touch-action:auto}
         @media (max-width:600px){#stage{padding-right:calc(52px + env(safe-area-inset-right))}}
         #frame{margin:0 auto;visibility:hidden}
         .page{background:#fff}
         .page img{width:100%;height:100%;display:block;object-fit:contain}
         .page.filler{background:#000}
         .filler .bg{width:100%;height:100%;background:url("images/magic-eye-bg.webp") 0 0/600px auto repeat}
         /* Turning onto a cover, page-flip draws the empty filler side over the page still lying
            there, but a pixel short of its outer edges, so a white hairline of that page leaks out.
            Trim those edges while it happens; the background behind is the same pattern. */
         .page.filler.--left:not(.--simple) ~ .page.--left.--simple{clip-path:inset(1px 0 1px 1px)}
         .page.--right.--simple:has(~ .page.filler.--right:not(.--simple)){clip-path:inset(1px 1px 1px 0)}
         #status{position:absolute;left:0;right:0;top:50%;text-align:center}
         /* Crayons */
         .page .ink{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
         .page .ink:not([src]){display:none}
         /* The drawing layers and the crayons are placed on the page (absolute, not fixed), so when
            a phone zooms in they zoom and pan along with the magazine instead of floating over it. */
         #draw,#pending{position:absolute;left:0;top:0;opacity:.85;pointer-events:none}
         /* One finger draws; two fingers still zoom and pan the page (phones). */
         #draw{display:none;touch-action:pinch-zoom;z-index:20}
         #pending{z-index:19}
         #erasing{position:absolute;left:0;top:0;z-index:18;pointer-events:none}
         body.writing #draw{display:block;pointer-events:auto}
         /* Crayon size: as big as --chmax, but small enough that the whole column fits the screen
            height (3 crayons + a pencil 1.6x as tall + 3 gaps + a little margin). */
         :root{--chmax:96px;--ch:min(var(--chmax),calc((100vh - 40px) / 4.6))}
         @supports (height:100dvh){:root{--ch:min(var(--chmax),calc((100dvh - 40px) / 4.6))}}
         #crayons{position:absolute;left:-999px;top:0;z-index:21;display:flex;flex-direction:column;
         gap:10px;visibility:hidden}
         .crayon{display:block;width:40px;height:var(--ch);padding:0 9px;margin:0;border:0;background:none;
         cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .28s cubic-bezier(.34,1.56,.64,1);
         filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
         .crayon svg{display:block;width:22px;height:var(--ch)}
         .crayon img{display:block;height:var(--ch);width:auto;margin:0 auto}
         .crayon.tall,.crayon.tall img{height:calc(var(--ch) * 1.6)}
         .crayon.on{transform:translate(-6px,-10px) rotate(-12deg)}
         .crayon.held{visibility:hidden}   /* desktop: it's in your hand (the cursor) */
         .flying{position:fixed;left:0;top:0;z-index:30;pointer-events:none;transform-origin:50% 50%;
         filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
         .flying svg,.flying img{display:block;width:100%;height:100%}
         /* Magnifying glass (computers and tablets). It starts small, held in a fist at the left, halfway up;
            pull it out and it grows, drop it back on the (open) hand to put it away. */
         #loupe{position:fixed;left:0;top:0;z-index:22;display:none;pointer-events:none;touch-action:none;
         -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
         #loupe.out{display:block}
         #loupe canvas{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:50%;
         pointer-events:auto;cursor:grab}
         body.writing #loupe canvas{pointer-events:none}   /* drawing goes through the glass */
         #loupe svg{position:absolute;left:-20%;top:-20%;width:210%;height:210%;overflow:visible;pointer-events:none;
         filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
         #loupe .grip{pointer-events:visiblePainted;cursor:grab}
         #loupe .rim.grip{pointer-events:visibleStroke}
         #loupe.dragging canvas,#loupe.dragging .grip{cursor:grabbing}
         .hand{position:fixed;left:0;top:0;display:none;visibility:hidden;pointer-events:none;
         -webkit-user-drag:none;user-select:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
         #handOpen{z-index:21;transform-origin:50% 100%;transition:transform .15s;   /* under the glass */
         pointer-events:auto;cursor:pointer}   /* click the empty hand: the glass comes back to it */
         #handOpen.ready{transform:scale(1.07)}   /* "drop it here" */
         #handFist{z-index:23;pointer-events:auto;cursor:grab}   /* over the handle it grips */
         /* Desktop: bigger crayons (they're thin, so they need the size to be seen). */
         @media (hover:hover) and (pointer:fine){
            :root{--chmax:144px}
            .crayon{width:56px;padding:0 12px}
            #stage{padding-right:calc(88px + env(safe-area-inset-right));padding-left:calc(112px + env(safe-area-inset-left))}
         }
         /* Phones and tablets: while a page is scrolled right to the top, Safari fills its top and
            bottom bars with the flat background colour (grey), not the pattern. Scrolled, it shows
            the page behind them. So there's a strip of background above and below the reader and
            the page is kept scrolled to the reader (the script's BLEED), with the pattern lined up
            to start at the top of the screen as before. Only the browser scrolls it, not fingers. */
         html.bleed{padding:100px 0 160px;overflow-y:scroll;scrollbar-width:none;background-position:center 100px}
         html.bleed::-webkit-scrollbar{display:none}
         html.bleed body{overflow:clip;touch-action:pinch-zoom}
         html.bleed.zoomed body{touch-action:auto}
         html.bleed #status{top:calc(50% + 100px)}
         /* Tablet: room on the left for the hand holding the glass, and no pinch-zoom anywhere. */
         html.tablet #stage{padding-left:calc(112px + env(safe-area-inset-left))}
         html.tablet,html.tablet body,html.tablet #stage,html.tablet #book,html.tablet #draw,html.tablet .hand{touch-action:none}
         @media (max-width:600px){:root{--chmax:76px}.crayon{width:34px;padding:0 7px}.crayon svg{width:20px}}
         /* Print button, like the old point-and-click games: a little printer that opens the PDF.
            Computers and tablets: in the bottom of the left margin, under the hand. Phones: in the
            bar beside Back. The paper feeds out a little on hover. */
         #print{display:inline-flex;align-items:center;gap:6px;margin-right:auto;text-decoration:none;
         -webkit-tap-highlight-color:transparent}
         #print[hidden]{display:none}
         /* Pixel art (tools/make_printer.py): back, paper and front layers, the paper rising on hover.
            Shown at 1:1 on computers (crisp at 2x too) and a third of that on phones. */
         #print .printer{display:block;width:32px;height:29.33px;--lift:-1.5px;image-rendering:pixelated;
         background:url("images/printer-front.png") 0 0/100% 100% no-repeat,url("images/printer-paper.png") 0 0/100% 100% no-repeat,
         url("images/printer-back.png") 0 0/100% 100% no-repeat;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6));
         transition:background-position .25s cubic-bezier(.34,1.56,.64,1)}
         #print:hover .printer,#print:focus-visible .printer{background-position:0 0,0 var(--lift),0 0}
         #print:active .printer{transform:translateY(1px)}
         html:not(.bleed) #print,html.tablet #print{position:fixed;z-index:4;flex-direction:column;gap:0;
         left:max(14px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom))}
         html:not(.bleed) #print .printer,html.tablet #print .printer{width:96px;height:88px;--lift:-4px}
         /* Phone on its side: put Back/PDF in the left margin so the book gets the full height. */
         @media (orientation:landscape) and (max-height:500px){
            .bar{position:absolute;top:0;left:0;z-index:5;flex-direction:column;align-items:flex-start;gap:8px;
            padding:max(8px,env(safe-area-inset-top)) 8px 8px max(10px,env(safe-area-inset-left))}
            #stage{padding-top:max(8px,env(safe-area-inset-top));padding-bottom:max(8px,env(safe-area-inset-bottom));
            padding-left:calc(84px + env(safe-area-inset-left))}
            html.bleed .bar{top:100px}
         }
      </style>
   </head>
   <body>
      <div class="bar">
         <a href="./">&larr; Back</a>
         <a id="print" href="#" target="_blank" rel="noopener" title="Print (opens the PDF)" aria-label="Print" hidden>
            <span class="printer" aria-hidden="true"></span>
         </a>
         <a id="dl" href="#" download hidden>PDF</a>
      </div>
      <div id="stage"><div id="frame"><div id="book"></div></div></div>
      <div id="status">Loading&hellip;</div>
      <canvas id="erasing"></canvas>
      <canvas id="pending"></canvas>
      <canvas id="draw"></canvas>
      <div id="crayons">
         <button class="crayon" data-color="#D3212D" style="--c:#D3212D" aria-label="Red crayon" aria-pressed="false" data-cursor="images/crayon-red-cursor.png" data-hotspot="1 38" data-cursor-len="54"><img src="images/crayon-red.png" alt=""></button>
         <button class="crayon" data-color="#2E3A8C" style="--c:#2E3A8C" aria-label="Blue crayon" aria-pressed="false" data-cursor="images/crayon-blue-cursor.png" data-hotspot="1 38" data-cursor-len="54"><img src="images/crayon-blue.png" alt=""></button>
         <button class="crayon" data-color="#EDBE1F" style="--c:#EDBE1F" aria-label="Yellow crayon" aria-pressed="false" data-cursor="images/crayon-yellow-cursor.png" data-hotspot="1 38" data-cursor-len="54"><img src="images/crayon-yellow.png" alt=""></button>
         <button class="crayon tall" data-color="#4a4a4a" style="--c:#4a4a4a" aria-label="Pencil (right-click erases)" aria-pressed="false" data-cursor="images/pencil-cursor.png" data-hotspot="1 38" data-cursor-len="56" data-eraser-cursor="images/pencil-eraser-cursor.png" data-eraser-hotspot="1 37"><img src="images/pencil.png" alt=""></button>
      </div>
      <div id="loupe">
         <canvas></canvas>
         <svg viewBox="-140 -140 420 420" aria-hidden="true">
            <!-- The magnifier photo (images/magnifier.png: background cut away, glass see-through
                 apart from its glare). Placed so the glass is a circle of radius 100 round (0,0) and
                 the handle runs out at 45 degrees; #lensArm turns it for the hand. The shapes after
                 it are invisible grab areas over the rim, neck and handle. -->
            <g id="lensArm">
               <image href="images/magnifier.png" x="-143.95" y="-142.66" width="416.3" height="416.3"/>
               <circle class="rim grip" r="104.5" fill="none" stroke="#000" stroke-width="12" opacity="0"/>
               <g transform="rotate(45)">
                  <rect class="grip" x="105" y="-12" width="32" height="24" fill="#000" opacity="0"/>
                  <rect class="grip" x="134" y="-17" width="191" height="34" rx="8" fill="#000" opacity="0"/>
               </g>
            </g>
            <!-- The glass itself is drawn, not photographed: a faint inner highlight and two soft
                 glare reflections (top, and lower left) over the magnified view. -->
            <defs>
               <linearGradient id="lt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity=".08"/></linearGradient>
            </defs>
            <circle r="99.3" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1.2"/>
            <path d="M-83 -48 A96 96 0 0 1 79 -55 Q0 -78 -83 -48 Z" fill="url(#lt)"/>
            <path d="M-40.6 87 A96 96 0 0 1 -94.5 -16.7 Q-72 42 -40.6 87 Z" fill="#fff" opacity=".4"/>
         </svg>
      </div>
      <img id="handOpen" class="hand" src="images/hand-open.png" alt="">
      <img id="handFist" class="hand" src="images/hand-fist.png" alt="">

      <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
      <script>
      // Where the background pattern's tiles start on screen (600px wide, centred, from the top of
      // the screen once the page sits at its usual scroll).
      var bgTop = parseFloat(getComputedStyle(document.documentElement).paddingTop) || 0;
      function bgOrigin() {
         var r = document.documentElement.getBoundingClientRect();
         return { x: r.left + (r.width - 600) / 2, y: r.top + bgTop };
      }
      (async function () {
         // Phones and tablets: keep the page scrolled just past the strip above it (html.bleed), so
         // Safari shows the pattern behind its toolbars. Left alone while zoomed in.
         var BLEED = document.documentElement.classList.contains('bleed') ? bgTop : 0;
         function settle() {
            if (BLEED && !zoomed() && Math.abs(window.scrollY - BLEED) > 0.5) window.scrollTo(0, BLEED);
         }
         if (BLEED) {
            if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
            settle();
            ['scroll', 'resize', 'pageshow', 'load'].forEach(function (t) { window.addEventListener(t, settle, { passive: true }); });
         }
         var status = document.getElementById('status');
         var stage = document.getElementById('stage');
         var frame = document.getElementById('frame');
         var book = document.getElementById('book');

         // reader.html?issue=2025 reads pages/2025/info.json and pages/2025/1.webp, 2.webp, ...
         // (made by tools/render_pages.py)
         var slug = new URLSearchParams(location.search).get('issue') || '';
         if (!/^[\w-]+$/.test(slug)) { status.textContent = 'Issue not found.'; return; }
         var dir = 'pages/' + slug + '/';

         var info;
         try {
            info = await (await fetch(dir + 'info.json')).json();
         } catch (e) {
            status.textContent = 'Issue not found.';
            return;
         }
         document.title = info.title;
         var printBtn = document.getElementById('print');
         printBtn.href = info.pdf;
         printBtn.hidden = false;
         // The PDF link only shows if the flipbook can't open.
         function fallBack() {
            var dl = document.getElementById('dl');
            dl.href = info.pdf;
            dl.hidden = false;
            status.style.display = '';
            status.innerHTML = 'Couldn\u2019t open the flipbook. <a></a>';
            var a = status.querySelector('a');
            a.href = info.pdf;
            a.textContent = 'Read the PDF instead';
         }
         if (typeof St === 'undefined') return fallBack();

         var n = info.pages, ratio = info.width / info.height, MINW = 200, PF_MIN = 100;

         // Book layout, by page-flip index: [filler, cover], [2, 3], ... , [last, filler?]
         // The library hides the page being turned by drawing the page underneath over it, so
         // "nothing" beside the front and back covers has to be a real page. These fillers are
         // painted with the site background, lined up with it so they look like empty space.
         // With a filler at index 0, page-flip index i is magazine page i.
         var fillerBgs = [];
         function addFiller() {
            var f = document.createElement('div');
            f.className = 'page filler';
            var bg = document.createElement('div');
            bg.className = 'bg';
            f.appendChild(bg);
            book.appendChild(f);
            fillerBgs.push(bg);
         }
         addFiller();
         var imgs = [], inkImgs = { crayon: [], pencil: [] };
         for (var i = 1; i <= n; i++) {
            var div = document.createElement('div');
            div.className = 'page';
            var img = document.createElement('img');
            img.alt = '';
            img.decoding = 'async';
            div.appendChild(img);
            ['crayon', 'pencil'].forEach(function (layer) {   // scribble layers, pencil on top
               var ink = document.createElement('img');
               ink.className = 'ink';
               ink.alt = '';
               div.appendChild(ink);
               inkImgs[layer].push(ink);
            });
            book.appendChild(div);
            imgs.push(img);
         }
         if (n % 2 === 0) addFiller();

         // Fetch the cover alone first so it isn't competing for bandwidth, then the rest in order.
         imgs[0].src = dir + '1.webp';
         var coverOK = await imgs[0].decode().then(function () { return true; }, function () { return false; });
         if (!coverOK) return fallBack();
         imgs.slice(1).forEach(function (img, k) { img.src = dir + (k + 2) + '.webp'; });

         // Size the book so a spread (or single page on narrow screens) fits the viewport.
         // Two pages when each is still a decent size (desktop), or when they come out nearly as
         // big as one page alone would (a phone on its side, where height is what limits them).
         var frameW = 0, spread = true, refit = false;
         function fit() {
            // Zoomed in on a phone, Safari's toolbars come and go as you pan, which fires resizes.
            // Leave the book alone until you zoom back out, or it shifts about under your fingers.
            if (frameW && zoomed()) { refit = true; return; }
            var cs = getComputedStyle(stage);   // padding leaves room for the crayons on the right
            var aw = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
            var ah = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
            var spreadW = Math.min(aw, ah * ratio * 2), singleW = Math.min(aw, ah * ratio);
            spread = spreadW / 2 >= MINW || spreadW / 2 >= 0.75 * singleW;
            frameW = Math.max(spread ? 2 * PF_MIN : PF_MIN, Math.floor(spread ? spreadW : singleW));
            frame.style.width = frameW + 'px';
            // page-flip shows one page when the book is narrower than 2 x minWidth; steer it with that.
            if (flip) flip.getSettings().minWidth = spread ? PF_MIN : frameW;
         }
         window.addEventListener('resize', fit);   // added before page-flip's own resize handler, so it runs first
         var flip;
         fit();

         try {
         flip = new St.PageFlip(book, {
            width: info.width, height: info.height,
            size: 'stretch',
            minWidth: spread ? PF_MIN : frameW, maxWidth: 2000,
            minHeight: PF_MIN / ratio, maxHeight: 2000 / ratio,
            startPage: 1,
            usePortrait: true,
            maxShadowOpacity: 0.5,
            mobileScrollSupport: true   // don't cancel every touch on the book; that blocks pinch-zoom
         });
         flip.loadFromHTML(book.querySelectorAll('.page'));
         } catch (e) { return fallBack(); }
         book.style.minWidth = book.style.minHeight = '';   // fit() sizes the book; don't let a stale minimum win
         status.style.display = 'none';
         frame.style.visibility = 'visible';

         // Line the fillers' pattern up with the page background.
         // Checked every frame (cheap) so it stays put through flips, resizes and re-layouts.
         (function alignFillers() {
            var o = bgOrigin(), ox = o.x, oy = o.y;
            fillerBgs.forEach(function (bg) {
               var r = bg.getBoundingClientRect();
               var pos = (ox - Math.round(r.left)) + 'px ' + (oy - Math.round(r.top)) + 'px';
               if (bg.style.backgroundPosition !== pos) bg.style.backgroundPosition = pos;
            });
            requestAnimationFrame(alignFillers);
         })();

         // One page at a time (phones): never stop on a filler.
         function skipFillers() {
            if (flip.getOrientation() !== 'portrait') return;
            var i = flip.getCurrentPageIndex();
            if (i < 1) flip.turnToPage(1);
            if (i > n) flip.turnToPage(n);
         }
         flip.on('flip', skipFillers);
         flip.on('changeOrientation', skipFillers);

         // Page-turn sound: sounds/page-turn.mp3 if it's there, otherwise one made on the fly with
         // Web Audio (a papery swish with a little crinkle, then the page landing). Pitch and
         // loudness vary a bit each time. Browsers only allow sound after a click/tap/key, which
         // is always how a turn starts anyway.
         var SOUND_FILE = 'sounds/page-turn.mp3';
         var audio = null;
         function unlockAudio() {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            if (!audio) {
               try { audio = new AC(); } catch (e) { return; }
               var sr = audio.sampleRate;
               audio.swish = audio.createBuffer(1, Math.floor(sr * 0.5), sr);
               var d = audio.swish.getChannelData(0), crinkle = 0, soft = 0;
               for (var i = 0; i < d.length; i++) {
                  var t = i / sr, env = t < 0.06 ? t / 0.06 : Math.exp(-(t - 0.06) / 0.11);
                  if (Math.random() < 0.004) crinkle = 1;   // little bursts, like paper catching
                  crinkle *= 0.995;
                  var w = Math.random() * 2 - 1;
                  soft = soft * 0.6 + w * 0.4;
                  d[i] = (soft * 0.8 + w * 0.2) * env * (0.55 + 0.45 * crinkle);
               }
               audio.thump = audio.createBuffer(1, Math.floor(sr * 0.08), sr);
               d = audio.thump.getChannelData(0);
               for (i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / sr / 0.015);
               var ctx = audio;
               fetch(SOUND_FILE).then(function (r) { if (!r.ok) throw 0; return r.arrayBuffer(); }).then(function (bytes) {
                  return new Promise(function (ok, bad) { ctx.decodeAudioData(bytes, ok, bad); });   // callback form for older Safari
               }).then(function (buf) { ctx.file = buf; }, function () {});
            }
            if (audio.state === 'suspended') audio.resume();
         }
         ['pointerdown', 'keydown', 'touchend'].forEach(function (t) {
            window.addEventListener(t, unlockAudio, { capture: true, passive: true });
         });
         var lastSound = 0;
         function pageSound() {
            if (!audio || audio.state !== 'running') return;
            if (Date.now() - lastSound < 300) return;   // a drag that ends in a swipe is still one turn
            lastSound = Date.now();

                  sctx.beginPath(); sctx.rect(0, 0, w, h); sctx.clip();
                  tiles(+at[0], +at[1], 0, 0, w, h);
               } else {   // the page picture, then its crayon and pencil layers
                  sctx.fillStyle = '#fff';
                  sctx.fillRect(0, 0, w, h);
                  [].forEach.call(el.querySelectorAll('img'), function (im) {
                     if (im.getAttribute('src') && im.complete && im.naturalWidth && im.style.visibility !== 'hidden')
                        sctx.drawImage(im, 0, 0, w, h);
                  });
               }
               sctx.restore();
            });
         }

         // Paint what's under the lens (pages, ink, strokes in progress) into src, at MAG x screen
         // resolution, then bend it onto the lens.
         function renderLens() {
            var dprNow = window.devicePixelRatio || 1;
            var R = lens.R * lens.s, Rs = R * SRC_PAD, k = Math.min(dprNow * MAG, 2048 / (2 * Rs));
            var S = Math.ceil(2 * Rs * k), x0 = lens.x - Rs, y0 = lens.y - Rs, W = 2 * Rs;
            if (src.width !== S) src.width = src.height = S;
            sctx.setTransform(k, 0, 0, k, -x0 * k, -y0 * k);
            sctx.globalAlpha = 1;
            sctx.fillStyle = '#7f7765';
            sctx.fillRect(x0, y0, W, W);
            // the page background
            var bo = bgOrigin();
            tiles(bo.x, bo.y, x0, y0, x0 + W, y0 + W);
            var b = canvasRect;
            drawBook(b.left, b.top);
            sctx.globalAlpha = 0.85;   // same as the #pending / #draw opacity
            sctx.drawImage(pend, b.left, b.top, b.width, b.height);
            if (stroke) {   // the wet stroke, with its grain (on screen that's a CSS mask)
               var tw2 = Math.ceil(W * dpr), rx = (x0 - b.left) * dpr, ry = (y0 - b.top) * dpr;
               if (tmp.width !== tw2) tmp.width = tmp.height = tw2;
               tctx.setTransform(1, 0, 0, 1, 0, 0);
               tctx.globalCompositeOperation = 'source-over';
               tctx.clearRect(0, 0, tw2, tw2);
               tctx.drawImage(draw, -rx, -ry);
               tctx.globalCompositeOperation = 'destination-in';
               tctx.setTransform(1, 0, 0, 1, -rx, -ry);   // grain lines up with the draw canvas, as in bake()
               tctx.fillStyle = stroke.grain.pattern;
               tctx.fillRect(rx, ry, tw2, tw2);
               tctx.globalCompositeOperation = 'source-over';
               sctx.drawImage(tmp, x0, y0, tw2 / dpr, tw2 / dpr);
            }
            sctx.globalAlpha = 1;
            sctx.drawImage(ers, b.left, b.top, b.width, b.height);

            if (gl) {
               gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
               gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            } else {
               var P = lensCv.width, c = S / 2, h = R / MAG * k;
               lctx.setTransform(1, 0, 0, 1, 0, 0);
               lctx.clearRect(0, 0, P, P);
               lctx.save();
               lctx.beginPath(); lctx.arc(P / 2, P / 2, P / 2, 0, Math.PI * 2); lctx.clip();
               lctx.drawImage(src, c - h, c - h, 2 * h, 2 * h, 0, 0, P, P);
               lctx.restore();
            }
         }
         // Redraw only when something under the lens changed, and every frame while a stroke is
         // going or a page is being peeked at or turned.
         var lensKey = '', lensBump = 0, lensHot = 0;
         [].concat(imgs, inkImgs.crayon, inkImgs.pencil).forEach(function (im) {
            im.addEventListener('load', function () { lensBump++; });
         });
         bgImg.onload = function () { lensBump++; };
         (function lensLoop() {
            requestAnimationFrame(lensLoop);
            if (!lens.out || !canvasRect) return;
            if (stroke || erase) lensHot = 30;   // and keep going a moment after, while ink settles
            if (flipState !== 'read') lensHot = Math.max(lensHot, 3);
            var key = [lens.x, lens.y, lens.R, lens.s, lastLayout, flip.getCurrentPageIndex(), lensBump, strokeGen, committedGen].join();
            if (key === lensKey && lensHot <= 0) return;
            if (lensHot > 0) lensHot--;
            lensKey = key;
            renderLens();
         })();

         // Start in the hand (the last spot it was out at is remembered, in this browser).
         if (glass) {
            loupe.classList.add('out');
            handOpen.style.display = handFist.style.display = 'block';
            sizeLens();
            placeHand();
            var at = null;
            try { at = JSON.parse(localStorage.getItem('uncle-glass')); } catch (e) {}
            if (at && at.x >= 0 && at.x <= 1 && at.y >= 0 && at.y <= 1) spot = { x: at.x, y: at.y };
            var p0 = heldPose();   // always starts in the hand; a click takes it out to the last spot
            lens.x = p0.x; lens.y = p0.y; lens.s = p0.s; lens.a = p0.a;
            applyLens();
            showHand();
         }

         // Grabbing it. Without a crayon the whole glass is a handle; with one, only the rim,
         // handle and fist are (the middle lets your strokes through, see the CSS). Taking it out
         // of the hand opens the hand and grows the glass under the pointer; letting go of it
         // over the open hand puts it back, and the hand closes on it. A quick click (no drag,
         // not held down) sends it back to the hand, or from the hand back to where it was.
         var drag = null, ptr = { x: 0, y: 0 };
         function isGlass(el) { return el && el.nodeType === 1 && (loupe.contains(el) || el === handFist || el === handOpen); }
         function grab(e) {
            if (!lens.out || drag || (e.pointerType === 'mouse' && e.button !== 0)) return;
            e.preventDefault();
            e.stopPropagation();
            e.target.setPointerCapture(e.pointerId);
            ptr = { x: e.clientX, y: e.clientY };
            var click = { t0: performance.now(), sx: e.clientX, sy: e.clientY, moved: false, wasHeld: lens.held };
            if (lens.held) {
               lens.held = false;
               showHand();
               drag = { id: e.pointerId, nx: 0, ny: 0, over: false, click: click };
               animateTo(function () { return { x: ptr.x, y: ptr.y, s: 1, a: OUT_A }; }, 300);
            } else {
               var r0 = lens.R * lens.s;   // where on the glass it was grabbed, as a fraction of its size
               drag = { id: e.pointerId, nx: (lens.x - e.clientX) / r0, ny: (lens.y - e.clientY) / r0, over: false, click: click };
               save();   // remember where it was picked up from, in case it goes back to the hand
            }
            loupe.classList.add('dragging');
         }
         loupe.addEventListener('pointerdown', grab);
         handFist.addEventListener('pointerdown', grab);
         handFist.addEventListener('dragstart', function (e) { e.preventDefault(); });
         // Clicking the empty hand calls the glass back from wherever it is (remembering that spot).
         handOpen.addEventListener('dragstart', function (e) { e.preventDefault(); });
         handOpen.addEventListener('click', function () {
            if (!lens.out || lens.held || drag) return;
            save();
            goHome();
         });
         window.addEventListener('pointermove', function (e) {
            if (!drag || e.pointerId !== drag.id) return;
            ptr = { x: e.clientX, y: e.clientY };
            var c = drag.click;
            if (Math.abs(ptr.x - c.sx) + Math.abs(ptr.y - c.sy) > 6) c.moved = true;
            drag.over = overHand(ptr.x, ptr.y);
            handOpen.classList.toggle('ready', drag.over);
         });
         function letGo(e) {
            if (!drag || e.pointerId !== drag.id) return;
            var over = drag.over, c = drag.click;
            var clicked = e.type === 'pointerup' && !c.moved && performance.now() - c.t0 < 300;
            drag = null;
            loupe.classList.remove('dragging');
            handOpen.classList.remove('ready');
            if (clicked && c.wasHeld) {   // click on the hand: out to where it was last time
               animateTo(spotPose(), 320, save);
            } else if (clicked || over) {
               goHome();
            } else if (tween) {   // still coming out of the hand
               tween.done = save;
            } else {   // let go somewhere else: back to full size, where it is
               animateTo({ x: lens.x, y: lens.y, s: 1, a: OUT_A }, 180, save);
            }
         }
         window.addEventListener('pointerup', letGo);
         window.addEventListener('pointercancel', letGo);
         // Keep page-flip out of moving the glass (no corner peeks or turns from that), but let
         // it see the pointer passing over the glass otherwise, so a corner can still be peeked
         // at or a page dragged across under the glass.
         ['mousedown', 'mousemove', 'mouseup', 'touchstart', 'touchmove', 'touchend'].forEach(function (t) {
            var starts = t === 'mousedown' || t === 'touchstart';
            window.addEventListener(t, function (e) {
               if (drag || (starts && isGlass(e.target))) e.stopPropagation();
            }, true);
         });
      }
      </script>
   </body>
</html>
